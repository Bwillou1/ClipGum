name: ClipGumMobile
options:
  bundleIdPrefix: com.clipgum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ClipGum:
    path: ../..
targets:
  ClipGumMobile:
    type: application
    platform: iOS
    sources:
      - ClipGumMobileApp.swift
      - MobileCompanionView.swift
      - MobileHandoffView.swift
      - MobileInferenceEngine.swift
    dependencies:
      - package: ClipGum
        product: ClipGumCore
      - target: ClipGumMobileAction
      - target: ClipGumMobileKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipgum.ClipGumMobile
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.2.0
  ClipGumMobileAction:
    type: app-extension
    platform: iOS
    sources:
      - ActionExtension/ActionViewController.swift
    dependencies:
      - package: ClipGum
        product: ClipGumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipgum.ClipGumMobile.ActionExtension
        INFOPLIST_FILE: ActionExtension/Info.plist
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.2.0
  ClipGumMobileKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension/KeyboardViewController.swift
    dependencies:
      - package: ClipGum
        product: ClipGumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipgum.ClipGumMobile.KeyboardExtension
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.2.0
