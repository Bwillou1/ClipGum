name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select an SDK with NSPasteboard.accessBehavior
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          xcodebuild -version
      - name: Resolve pinned dependencies
        run: |
          swift package resolve
          cat Package.resolved
          swift build --target LlamaSwift
      - name: Validate release scripts and SBOM
        shell: bash
        run: |
          set -euo pipefail
          for script in Build/*.sh Scripts/package_app.sh; do bash -n "$script"; done
          python3 -m json.tool Build/Models/manifest.schema.json >/dev/null
          python3 -m json.tool Build/SBOM.json >/dev/null
          python3 Build/generate_sbom.py --output /tmp/ClipGum-SBOM.json
          python3 -m json.tool /tmp/ClipGum-SBOM.json >/dev/null
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          swift test 2>&1 | tee /tmp/clipgum-swift-test.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            grep -E 'error:|XCTAssert|failed|Fatal error' /tmp/clipgum-swift-test.log \
              | sort -u \
              | head -n 40 \
              | while IFS= read -r line; do
                  line=${line//$'\r'/}
                  line=${line//'%'/'%25'}
                  printf '::error::%s\n' "$line"
                done
            tail -n 80 /tmp/clipgum-swift-test.log \
              | while IFS= read -r line; do
                  line=${line//$'\r'/}
                  line=${line//'%'/'%25'}
                  printf '::error::%s\n' "$line"
                done
          fi
          exit "$status"
      - name: Build and smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail
          swift build --configuration release --product clipgum
          printf 'token=Abcd1234efgh5678\n' | .build/release/clipgum clean-secrets --raw > /tmp/clipgum-cli-smoke.txt
          grep -q 'token=\[REDACTED\]' /tmp/clipgum-cli-smoke.txt
          ! grep -q 'Abcd1234efgh5678' /tmp/clipgum-cli-smoke.txt
          printf '{"name":"ClipGum","count":1}\n' | .build/release/clipgum json-to-ts --raw > /tmp/clipgum-cli-ts.txt
          grep -q 'export type Root' /tmp/clipgum-cli-ts.txt
          python3 - <<'PY'
          import subprocess
          line = 'token=Abcd1234efgh5678 https://example.com/?utm_source=x&id=1\n'
          payload = line * ((11 * 1024 * 1024) // len(line) + 1)
          result = subprocess.run(
              ['.build/release/clipgum', 'sanitize-text', '--raw'],
              input=payload, text=True, capture_output=True, check=True, timeout=45,
          )
          assert len(payload.encode()) > 10 * 1024 * 1024
          assert result.stdout.count('\n') == payload.count('\n')
          assert 'Abcd1234efgh5678' not in result.stdout
          assert 'utm_source' not in result.stdout
          PY
      - name: Validate packaging script
        run: bash -n Scripts/package_app.sh
      - name: Build app bundle
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./Scripts/package_app.sh 2>&1 | tee /tmp/clipgum-package.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            tail -n 50 /tmp/clipgum-package.log \
              | while IFS= read -r line; do
                  line=${line//$'\r'/}
                  line=${line//'%'/'%25'}
                  printf '::error::%s\n' "$line"
                done
          fi
          exit "$status"
      - name: Validate development distribution policy
        run: ./Build/validate_distribution.sh build/ClipGum.app --development
      - name: Verify Sparkle rejects a tampered archive
        run: ./Build/test_sparkle_tamper.sh
