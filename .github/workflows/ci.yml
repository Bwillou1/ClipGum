name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select an SDK with NSPasteboard.accessBehavior
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          xcodebuild -version
      - name: Resolve pinned dependencies
        run: |
          swift package resolve
          cat Package.resolved
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          set +e
          swift test 2>&1 | tee /tmp/clipgum-swift-test.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            grep -E 'error:|XCTAssert|failed|Fatal error' /tmp/clipgum-swift-test.log \
              | head -n 40 \
              | while IFS= read -r line; do
                  line=${line//$'\r'/}
                  line=${line//'%'/'%25'}
                  printf '::error::%s\n' "$line"
                done
          fi
          exit "$status"
      - name: Validate packaging script
        run: bash -n Scripts/package_app.sh
      - name: Build app bundle
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./Scripts/package_app.sh 2>&1 | tee /tmp/clipgum-package.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            grep -E 'error:|failed|Fatal error' /tmp/clipgum-package.log \
              | head -n 40 \
              | while IFS= read -r line; do
                  line=${line//$'\r'/}
                  line=${line//'%'/'%25'}
                  printf '::error::%s\n' "$line"
                done
          fi
          exit "$status"
